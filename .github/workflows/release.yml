name: NuGet Release

concurrency:
  group: nuget-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Explicitly authorize NuGet publication / NuGet公開を明示承認"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    uses: ./.github/workflows/candidate-preflight.yml
    with:
      require_publication_enabled: ${{ inputs.publish }}
  publish:
    if: ${{ inputs.publish == true }}
    needs: preflight
    name: Publish the audited preview after explicit approval
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Checkout reviewed control state
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download exact preflight artifacts
        uses: actions/download-artifact@v4
        with:
          name: reviewed-nuget-preview
          path: reviewed
      - name: Verify preflight source, version and package hashes
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('reviewed')
          audit = json.loads((root / 'candidate-audit.json').read_text())
          assert audit['candidate']['publication_enabled'] is True
          assert audit['candidate']['source_commit'] == os.environ['SOURCE_COMMIT']
          assert audit['candidate']['version'] == os.environ['VERSION']
          assert audit['distribution_scope_review']['complete'] is True
          assert audit['remaining_license_review'] == []
          for name, expected in ((audit['file'], audit['sha256']),
              ('PgCliSharp.' + os.environ['VERSION'] + '.snupkg', audit['symbols_sha256'])):
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected
          PY
      - name: Setup .NET for NuGet client
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - name: Reject existing immutable version or tag before NuGet login
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag_refs="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$tag_refs" ]; then
            echo "Tag already exists; inspect the prior publication before retrying." >&2
            exit 1
          fi
          status="$(curl -sS -o "$RUNNER_TEMP/nuget-index.json" -w '%{http_code}' https://api.nuget.org/v3-flatcontainer/pgclisharp/index.json)"
          if [ "$status" = 200 ]; then
            if jq -e --arg version "$VERSION" '.versions | index($version) != null' "$RUNNER_TEMP/nuget-index.json" >/dev/null; then
              echo "NuGet version already exists; inspect the prior publication before retrying." >&2
              exit 1
            fi
          elif [ "$status" != 404 ]; then
            echo "Unexpected NuGet HTTP status: $status" >&2
            exit 1
          fi
      - name: NuGet login with Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ needs.preflight.outputs.nuget_user }}
      - name: Publish the audited package and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: dotnet nuget push "reviewed/PgCliSharp.$VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      - name: Create immutable bilingual preview release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          TITLE: ${{ needs.preflight.outputs.title }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          prerelease_args=()
          if [ "$PRERELEASE" = true ]; then prerelease_args+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
            --title "$TITLE" "${prerelease_args[@]}" --notes-file reviewed/release-notes.md \
            "reviewed/PgCliSharp.$VERSION.nupkg" \
            "reviewed/PgCliSharp.$VERSION.snupkg"
      - name: Verify published release target and assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-list -n1 "$TAG")" = "$SOURCE_COMMIT"
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fx "PgCliSharp.$VERSION.nupkg" <<<"$assets"
          grep -Fx "PgCliSharp.$VERSION.snupkg" <<<"$assets"
