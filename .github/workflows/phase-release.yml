name: Phase Release

concurrency:
  group: phase-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Explicitly authorize external Phase Release publication"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.publish == true }}
    name: Publish phase artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication control state
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read and guard phase manifest
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          bash eng/validate-phase-metadata.sh
          test "$(jq -r '.publication_enabled' .github/phase-release.json)" = "true"

          echo "phase=$(jq -r '.phase' .github/phase-release.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag' .github/phase-release.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.title' .github/phase-release.json)" >> "$GITHUB_OUTPUT"
          echo "notes_file=$(jq -r '.notes_file' .github/phase-release.json)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.prerelease' .github/phase-release.json)" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(jq -r '.release_source_commit' .github/phase-release.json)" >> "$GITHUB_OUTPUT"

      - name: Preserve release notes
        env:
          NOTES_FILE: ${{ steps.phase.outputs.notes_file }}
        shell: bash
        run: cp "$NOTES_FILE" "$RUNNER_TEMP/phase-release-notes.md"

      - name: Verify deferred source commit
        env:
          SOURCE_COMMIT: ${{ steps.phase.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main

      - name: Checkout deferred phase source
        env:
          SOURCE_COMMIT: ${{ steps.phase.outputs.source_commit }}
        shell: bash
        run: git checkout --detach "$SOURCE_COMMIT"

      - name: Validate PostgreSQL compatibility specifications
        shell: bash
        run: bash eng/validate-compatibility-specs.sh

      - name: Restore
        run: dotnet restore PgCliSharp.slnx

      - name: Build
        run: dotnet build PgCliSharp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PgCliSharp.slnx --configuration Release --no-build --no-restore

      - name: Pack NuGet artifacts
        run: dotnet pack src/PgCliSharp/PgCliSharp.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Verify NuGet package artifacts
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.phase.outputs.source_commit }}
        run: bash eng/verify-nuget-package.sh artifacts

      - name: Create source ZIP
        env:
          TAG: ${{ steps.phase.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.phase.outputs.source_commit }}
        shell: bash
        run: git archive --format=zip --output "artifacts/pgcli-sharp-$TAG.zip" "$SOURCE_COMMIT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.phase.outputs.tag }}
          TITLE: ${{ steps.phase.outputs.title }}
          PRERELEASE: ${{ steps.phase.outputs.prerelease }}
          SOURCE_COMMIT: ${{ steps.phase.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable Phase artifacts." >&2
            exit 1
          fi

          prerelease_args=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/phase-release-notes.md" \
            "${prerelease_args[@]}" \
            "artifacts/pgcli-sharp-$TAG.zip" \
            artifacts/*.nupkg \
            artifacts/*.snupkg
