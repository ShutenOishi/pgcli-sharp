name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PgCliSharp.slnx

      - name: Build
        run: dotnet build PgCliSharp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PgCliSharp.slnx --configuration Release --no-build --no-restore

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/PgCliSharp/PgCliSharp.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Upload package artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pgclisharp-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
