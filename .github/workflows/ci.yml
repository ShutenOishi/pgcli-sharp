name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-pack:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate phase metadata and bilingual documentation
        shell: bash
        run: bash eng/validate-phase-metadata.sh

      - name: Validate NuGet release metadata
        shell: bash
        run: bash eng/validate-nuget-release.sh

      - name: Validate PostgreSQL compatibility specifications
        shell: bash
        run: bash eng/validate-compatibility-specs.sh

      - name: Validate evidence and compile-only README tooling
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s eng -p test_real_postgresql_evidence.py
          python3 -m unittest discover -s eng -p test_readme_examples.py
          python3 -m unittest discover -s eng -p test_licensing.py
          python3 -m unittest discover -s eng -p test_candidate_audit.py
          python3 -m unittest discover -s eng -p test_candidate_preflight.py
          python3 -m unittest discover -s eng -p test_native_postgresql.py
          python3 -m unittest discover -s eng -p test_analyze_windows_hang.py
          python3 -m unittest discover -s eng -p test_development_dependencies.py
          python3 eng/validate_candidate.py

      - name: Restore
        run: dotnet restore PgCliSharp.slnx

      - name: Build
        run: dotnet build PgCliSharp.slnx --configuration Release --no-restore

      - name: Verify hang reader against an owned CLR4 dump
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: python eng/analyze_windows_hang.py test-results tests/PgCliSharp.TestProcess/bin/Release/net48/PgCliSharp.TestProcess.exe

      - name: Test
        timeout-minutes: 10
        env:
          PGCLI_TEST_TRACE_DIRECTORY: ${{ github.workspace }}/test-results/process-stages
        run: dotnet test PgCliSharp.slnx --configuration Release --no-build --no-restore --logger trx --results-directory test-results --blame-hang-timeout 2m --blame-hang-dump-type ${{ runner.os == 'Windows' && 'full' || 'none' }} --diag test-results/vstest.log

      - name: Repeat Windows binary completion tests without retrying failures
        timeout-minutes: 10
        env:
          PGCLI_TEST_TRACE_DIRECTORY: ${{ github.workspace }}/test-results/process-stages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($tfm in @('net48', 'net8.0', 'net10.0')) {
            $rounds = if ($tfm -eq 'net48') { 30 } else { 3 }
            1..$rounds | ForEach-Object {
              dotnet test tests/PgCliSharp.Tests/PgCliSharp.Tests.csproj -c Release -f $tfm --no-build --no-restore --filter 'FullyQualifiedName~PsqlCompletionTests|FullyQualifiedName~ProcessSessionRunnerTests' --logger trx --results-directory "test-results/stress-$tfm-$_" --blame-hang-timeout 2m --blame-hang-dump-type full --diag "test-results/stress-$tfm-$_/vstest.log"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Read Windows hang stacks and remove intermediate dumps
        if: always() && runner.os == 'Windows'
        timeout-minutes: 6
        run: python eng/analyze_windows_hang.py test-results

      - name: Preserve deterministic test results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-tests-${{ matrix.os }}-${{ github.sha }}
          path: |
            test-results/**
            !test-results/**/*.dmp
          if-no-files-found: warn

      - name: Compile English and Japanese README examples without execution
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python eng/compile_readme_examples.py
          else
            python3 eng/compile_readme_examples.py
          fi

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/PgCliSharp/PgCliSharp.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Verify NuGet package artifacts
        if: runner.os == 'Linux'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash eng/verify-nuget-package.sh artifacts

      - name: Record development package provenance
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEVELOPMENT_SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          cat > artifacts/DEVELOPMENT-PACKAGE-PROVENANCE.txt <<EOF
          development_artifact=true
          publication_candidate=false
          source_commit=$DEVELOPMENT_SOURCE_COMMIT
          workflow_run_id=$WORKFLOW_RUN_ID
          preserved_publication_source=cccf8d9fbe1f2e1104676ab94a7863209c0220dd
          EOF

      - name: Upload development package artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pgclisharp-development-packages-${{ github.sha }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/DEVELOPMENT-PACKAGE-PROVENANCE.txt
            artifacts/DEVELOPMENT-DEPENDENCIES.json
          if-no-files-found: error

  release-preflight:
    name: Release preflight
    needs: build-test-pack
    uses: ./.github/workflows/candidate-preflight.yml
    with:
      require_publication_enabled: false

  candidate-audit:
    name: Unpublished candidate audit (${{ matrix.os }})
    needs: build-test-pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout audit controls
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate selected source main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python eng/verify_candidate_ci.py
      - name: Read pinned candidate source
        id: candidate
        shell: bash
        run: python eng/validate_candidate.py --outputs >> "$GITHUB_OUTPUT"
      - name: Checkout immutable selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate.outputs.source_commit }}
          path: candidate-source
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.100
      - name: Build, inspect and consume candidate without publication
        shell: bash
        run: |
          python eng/audit_candidate.py candidate-source candidate-artifacts
          cp source-ci-verification.json candidate-artifacts/source-ci-verification.json
      - name: Upload unpublished candidate and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pgclisharp-unpublished-candidate-${{ matrix.os }}-${{ github.sha }}
          path: candidate-artifacts/*
          if-no-files-found: error

  native-postgresql:
    name: Native PostgreSQL 18 (${{ matrix.os }}/net10.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      PGCLI_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native build tools
        run: python -m pip install meson==1.8.3 ninja==1.11.1.4
      - name: Build hash-verified native PostgreSQL 18
        run: python eng/native_postgresql.py build
      - name: Start exclusively owned native fixture
        timeout-minutes: 3
        run: python eng/native_postgresql.py setup
      - name: Execute public wrappers against native PostgreSQL
        timeout-minutes: 10
        run: >
          dotnet test tests/PgCliSharp.Tests/PgCliSharp.Tests.csproj
          -c Release -f net10.0 --filter FullyQualifiedName~RealPostgreSqlIntegrationTests
          --logger "trx;LogFileName=native.trx" --results-directory "${{ runner.temp }}/native-evidence"
          --blame-hang-timeout 2m --blame-hang-dump-type none
      - name: Collect exact native binary, server and scenario evidence
        if: always()
        timeout-minutes: 2
        run: python eng/native_postgresql.py collect "${{ runner.temp }}/native-evidence"
      - name: Stop only the owned native cluster
        if: always()
        timeout-minutes: 2
        run: python eng/native_postgresql.py stop
      - name: Preserve native evidence and failure logs
        if: always()
        timeout-minutes: 2
        run: python eng/native_postgresql.py stage native-artifacts
      - name: Upload native evidence from one portable artifact root
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-postgresql-18-${{ matrix.os }}-${{ github.sha }}
          path: native-artifacts/**
          if-no-files-found: error

  real-postgresql:
    name: Real PostgreSQL ${{ matrix.postgresql }} (Linux/net10.0)
    needs: build-test-pack
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgresql:
          - 10
          - 11
          - 12
          - 13
          - 14
          - 15
          - 16
          - 17
          - 18
    timeout-minutes: 25
    env:
      PGCLI_REAL_PG_MAJOR: ${{ matrix.postgresql }}
      PGCLI_REAL_PG_REQUIRED: 'true'
      PGCLI_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install source-build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex zlib1g-dev pkg-config

      - name: Set explicit runner-owned executable paths
        shell: bash
        run: |
          echo "PGCLI_PREFIX_ROOT=$RUNNER_TEMP/pgclisharp-postgresql" >> "$GITHUB_ENV"
          echo "PGCLI_REAL_PG_BIN=$RUNNER_TEMP/pgclisharp-postgresql/$PGCLI_REAL_PG_MAJOR/bin" >> "$GITHUB_ENV"

      - name: Cache verified PostgreSQL installations
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pgclisharp-postgresql
          key: pg-source-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.postgresql }}-${{ hashFiles('eng/postgresql-source-versions.json', 'eng/build-postgresql-source.sh') }}

      - name: Build pinned PostgreSQL sources
        shell: bash
        run: |
          bash eng/build-postgresql-source.sh "$PGCLI_REAL_PG_MAJOR"
          if [ "$PGCLI_REAL_PG_MAJOR" = 18 ]; then
            bash eng/build-postgresql-source.sh 16
            echo "PGCLI_REAL_PG_UPGRADE_FROM_BIN=$PGCLI_PREFIX_ROOT/16/bin" >> "$GITHUB_ENV"
          fi

      - name: Start owned socket-only PostgreSQL cluster
        shell: bash
        run: bash eng/setup-real-postgresql.sh

      - name: Run real PostgreSQL wrapper integration
        run: >
          dotnet test tests/PgCliSharp.Tests/PgCliSharp.Tests.csproj
          --framework net10.0
          --configuration Release
          --filter "FullyQualifiedName~RealPostgreSql"
          --logger "trx;LogFileName=real-postgresql.trx"
          --results-directory "${{ runner.temp }}/pgcli-evidence"

      - name: Record exact binary, server and scenario evidence
        if: always()
        shell: bash
        run: python3 eng/record_real_postgresql_evidence.py "$RUNNER_TEMP/pgcli-evidence"

      - name: Stop owned cluster
        if: always()
        shell: bash
        run: |
          if [ -n "${PGCLI_REAL_PG_ROOT:-}" ] && [ -f "$PGCLI_REAL_PG_ROOT/data/postmaster.pid" ]; then
            "$PGCLI_REAL_PG_BIN/pg_ctl" -D "$PGCLI_REAL_PG_ROOT/data" -m fast -t 30 -w stop
          fi

      - name: Upload real-executable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-postgresql-${{ matrix.postgresql }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pgcli-evidence/*
            ${{ runner.temp }}/pgcli-real-*/*.log
            /tmp/pgcli-phase8-*/*.log
          if-no-files-found: error
