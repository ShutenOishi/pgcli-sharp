name: CI

on:
  push:
    branches:
      - main
      - phase-0-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate phase release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/phase-release.json
          test -f "$(jq -r '.notes_file' .github/phase-release.json)"
          jq -e '
            (.phase | type == "number") and
            (.tag | type == "string" and test("^phase-[0-9]+$")) and
            (.title | type == "string" and length > 0) and
            (.notes_file | type == "string" and startswith("docs/releases/")) and
            (.prerelease | type == "boolean")
          ' .github/phase-release.json >/dev/null

      - name: Validate bilingual human-facing documentation
        shell: bash
        run: |
          set -euo pipefail

          phase="$(jq -r '.phase' .github/phase-release.json)"
          notes_file="$(jq -r '.notes_file' .github/phase-release.json)"

          test -f README.ja.md
          grep -F 'README.ja.md' README.md >/dev/null
          grep -F '## 日本語' "$notes_file" >/dev/null
          grep -F '## English' "$notes_file" >/dev/null
          english_line="$(grep -n -m1 '^## English$' "$notes_file" | cut -d: -f1)"
          japanese_line="$(grep -n -m1 '^## 日本語$' "$notes_file" | cut -d: -f1)"
          test -n "$english_line"
          test -n "$japanese_line"

          if [ "$phase" -ge 1 ]; then
            test "$english_line" -lt "$japanese_line"
          fi

      - name: Restore
        run: dotnet restore PgCliSharp.slnx

      - name: Build
        run: dotnet build PgCliSharp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PgCliSharp.slnx --configuration Release --no-build --no-restore

      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/PgCliSharp/PgCliSharp.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Upload package artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pgclisharp-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
